# Shared ccid runner; coverage selectors are explicit.
schema = 1
project = "nixci"

[checks.native]
kind = "nix"
mode = "native"
expected_checks = ["clients-eval", "cluster-eval", "cluster-render"]

[checks.eval]
kind = "nix"
mode = "eval"
expected_checks = ["clients-eval", "cluster-eval", "cluster-render"]

[checks.list]
kind = "nix"
mode = "list"
expected_checks = ["clients-eval", "cluster-eval", "cluster-render"]

[checks.all-systems]
kind = "nix"
mode = "all-systems"
expected_checks = ["clients-eval", "cluster-eval", "cluster-render"]
