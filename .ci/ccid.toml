# SPDX-License-Identifier: MIT OR Apache-2.0
# Shared ccid runner; coverage selectors are explicit.
schema = 1
project = "nixci"

[checks.native]
kind = "nix"
mode = "native"
expected_checks = ["argo-render", "clients-eval", "cluster-eval", "cluster-render", "reconciliation", "repository-policy"]

[checks.eval]
kind = "nix"
mode = "eval"
expected_checks = ["argo-render", "clients-eval", "cluster-eval", "cluster-render", "reconciliation", "repository-policy"]

[checks.list]
kind = "nix"
mode = "list"
expected_checks = ["argo-render", "clients-eval", "cluster-eval", "cluster-render", "reconciliation", "repository-policy"]

[checks.all-systems]
kind = "nix"
mode = "all-systems"
expected_checks = ["argo-render", "clients-eval", "cluster-eval", "cluster-render", "reconciliation", "repository-policy"]

[checks.policy]
kind = "commands"
commands = [["bash", ".ci/validate-policy.sh"]]

[checks.argo]
kind = "nix"
mode = "named"
checks = ["argo-render"]

[checks.reconciliation]
kind = "nix"
mode = "named"
checks = ["reconciliation"]
